version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - depguard
  settings:
    depguard:
      rules:
        # Constitution, Article III.2: the domain package must not know about HTTP.
        car-domain-no-http:
          files:
            - "**/internal/car/**"
          deny:
            - pkg: net/http
              desc: "internal/car must not depend on transport"
            - pkg: github.com/gin-gonic/gin
              desc: "internal/car must not depend on transport"
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Vlad-maker/my-cars-lib
